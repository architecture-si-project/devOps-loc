name: CI - Docker build and tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]


jobs:
  test-user-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r user-service/requirements.txt

      - name: Run tests
        run: |
          cd user-service
          python -m pytest

  test-reservation-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r reservation-service/requirements.txt

      - name: Run tests
        run: |
          cd reservation-service
          python -m pytest

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [test-user-service, test-reservation-service]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-user-service, test-reservation-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build user-service image
        run: docker build -t user-service ./user-service

      - name: Build reservation-service image
        run: docker build -t reservation-service ./reservation-service

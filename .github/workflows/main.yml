name: CI - Docker build and tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]


jobs:
  test-user-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r user-service/requirements.txt

      - name: Run tests with coverage
        run: |
          cd user-service
          python -m pytest --cov=user_app --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@v4
        with:
          name: user-service-coverage
          path: user-service/coverage.xml

  test-reservation-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r reservation-service/requirements.txt

      - name: Run tests with coverage
        run: |
          cd reservation-service
          python -m pytest --cov=reservation_app --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@v4
        with:
          name: reservation-service-coverage
          path: reservation-service/coverage.xml

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [test-user-service, test-reservation-service]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: user-service-coverage
          path: user-service

      - uses: actions/download-artifact@v4
        with:
          name: reservation-service-coverage
          path: reservation-service

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-user-service, test-reservation-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build user-service image
        run: docker build -t user-service ./user-service

      - name: Build reservation-service image
        run: docker build -t reservation-service ./reservation-service
